# Karaoke Vote sem nginx: a app fica diretamente na porta 3000.
#   docker compose up -d --build
services:
  app:
    build: .
    image: karaoke-vote
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/karaoke.db
      EDGE_PROXY: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - karaoke-data:/data

volumes:
  karaoke-data:
