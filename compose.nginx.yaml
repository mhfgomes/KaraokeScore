# KaraokeScore com nginx à frente (só o nginx fica exposto, na porta 80).
#   docker compose -f compose.nginx.yaml up -d --build
services:
  app:
    build: .
    image: karaokescore
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/karaoke.db
    expose:
      - "3000"
    volumes:
      - karaoke-data:/data

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  karaoke-data:
