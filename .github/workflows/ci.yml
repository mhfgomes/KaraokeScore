name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # bun instala as dependências; a app e os testes correm em Node 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Instala e gera o cliente Prisma (postinstall)
      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tipos
        run: bun run typecheck

      - name: Testes unitários
        run: bun run test

      - name: Build
        run: bun run build

      # Arrancam a app compilada numa BD SQLite temporária
      - name: Testes de API
        run: bun run test:api

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      # Só confirma que a imagem compila nas duas arquiteturas (não publica)
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
