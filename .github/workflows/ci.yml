name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # O prefixo evita partilhar o grupo com o workflow que chama este (release/nightly).
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # bun instala as dependências; a app e os testes correm em Node 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Instala e gera o cliente Prisma (postinstall)
      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tipos
        run: bun run typecheck

      - name: Testes unitários
        run: bun run test

      - name: Build
        run: bun run build

      # Arrancam a app compilada numa BD SQLite temporária
      - name: Testes de API
        run: bun run test:api

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configuração de teste
        run: cp .env.example .env

      - name: Build da imagem
        run: docker compose build

      - name: Arrancar (migrações + admin + app)
        run: docker compose up -d --wait --wait-timeout 90

      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/api/state > /dev/null
          curl -fsS http://localhost:3000/ao-vivo > /dev/null
          curl -fsS -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
            -d '{"username":"admin","password":"mudar-esta-password"}' \
            http://localhost:3000/api/admin/login | grep -q '"ok":true'

      - name: Logs do contentor em caso de falha
        if: failure()
        run: docker compose logs app

      - name: Remover contentores e volume
        if: always()
        run: docker compose down --volumes
