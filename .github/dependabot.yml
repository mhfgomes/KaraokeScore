version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # Atualizações menores juntas num só PR
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma fixado de propósito na versão estável
      - dependency-name: "prisma"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/*"
        update-types: [version-update:semver-major]
      # Tipos do Node acompanham o Node usado (24 LTS, ver .nvmrc)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Imagem base acompanha o Node 24 LTS
      - dependency-name: "node"
        update-types: [version-update:semver-major]
