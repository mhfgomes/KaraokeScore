# nginx do compose.nginx.yaml (a app está no contentor "app", porta 3000).

server {
    listen 80;
    server_name _;

    # O bloqueio por rede é configurado na app: ALLOW_EXTERNAL=false.

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # IP real do cliente; substitui qualquer valor enviado pelo próprio cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (tempo real): sem buffering e ligações longas
    location /api/events {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
